<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Talos Linux – stos systemu i zasady projektowe</title>
  <desc id="d">Jedna deklaratywna konfiguracja YAML opisuje stos Talosa: obraz SquashFS, jądro Linux, machined, Kubernetes i klaster HA. Poniżej zasady: napisany od zera, niezmienny, minimalny, efemeryczny i bezpieczny.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#2E2A6B" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0A0F1F" stop-opacity="0"/>
    </radialGradient>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38BDF8"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34D399"/></marker>
  </defs>
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap');
    .ti { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #E2E8F0; text-anchor: middle; }
    .ca { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace; font-size: 11.5px; fill: #93A3BC; text-anchor: middle; }
    .gl { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 500; letter-spacing: 2.4px; }
    .pill { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; text-anchor: middle; }
    .card { fill: #111A2E; stroke-width: 1.4; }
    .c-cy { stroke: #2B6F99; } .c-vi { stroke: #6D5BB5; } .c-pk { stroke: #9D3F72; } .c-gr { stroke: #1F8A66; }
    .ic { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 4 4; animation: dash 1s linear infinite; }
    .dots { fill: none; stroke-width: 1.6; stroke-dasharray: 2 5; animation: dots 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -8; } }
    @keyframes dots { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .flow, .dots { animation: none; } }
  ]]></style>

  <rect width="760" height="530" rx="16" fill="#0A0F1F"/>
  <rect width="760" height="530" rx="16" fill="url(#glow)"/>

  <!-- grupy -->
  <rect x="12" y="108" width="736" height="160" rx="12" fill="#0E1A33" fill-opacity=".7" stroke="#1C3556"/>
  <text x="28" y="129" class="gl" fill="#38BDF8">STOS SYSTEMU</text>
  <rect x="12" y="300" width="736" height="186" rx="12" fill="#14143A" fill-opacity=".6" stroke="#2E2A5E"/>
  <text x="28" y="321" class="gl" fill="#A78BFA">ZASADY PROJEKTOWE</text>
  <rect x="161" y="340" width="438" height="132" rx="12" fill="none" stroke="#4B4290" stroke-dasharray="4 4"/>

  <!-- połączenia -->
  <path d="M380 80 V104" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M157 198 H167" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M302 198 H312" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M447 198 H457" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M592 198 H602" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M525 348 V260" class="dots" stroke="#34D399" marker-end="url(#ag)"/>
  <path d="M738 198 H754 V510 H6 V48 H252" class="dots" stroke="#A78BFA" marker-end="url(#av)"/>

  <!-- pigułki -->
  <rect x="234" y="330" width="292" height="20" rx="10" fill="#0F1230" stroke="#4B4290"/>
  <text x="380" y="344" class="pill" fill="#C4B5FD">jeden obraz, nigdy nie modyfikowany</text>
  <rect x="534" y="274" width="132" height="20" rx="10" fill="#0B1F1C" stroke="#1F8A66"/>
  <text x="600" y="288" class="pill" fill="#6EE7B7">dane replikowane</text>
  <rect x="200" y="499" width="360" height="22" rx="11" fill="#0F1230" stroke="#4B4290"/>
  <text x="380" y="514" class="pill" fill="#C4B5FD">awaria węzła → nowy z tej samej konfiguracji</text>

  <!-- konfiguracja -->
  <rect x="260" y="16" width="240" height="64" rx="10" class="card c-pk"/>
  <circle cx="296" cy="48" r="18" fill="#F472B6" fill-opacity=".14"/>
  <g transform="translate(296 48)" class="ic" stroke="#F472B6">
    <path d="M-7 -10 H3 L8 -5 V10 H-7 Z"/><path d="M3 -10 V-5 H8"/><path d="M-3 0 H4 M-3 5 H2"/>
  </g>
  <text x="326" y="44" class="ti" style="text-anchor:start">Konfiguracja</text>
  <text x="326" y="63" class="ca" style="text-anchor:start">jeden plik YAML</text>

  <!-- stos -->
  <rect x="24" y="142" width="132" height="112" rx="10" class="card c-cy"/>
  <circle cx="90" cy="172" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(90 172)" class="ic" stroke="#38BDF8"><path d="M0 -9 L10 -4 L0 1 L-10 -4 Z"/><path d="M-10 1 L0 6 L10 1"/><path d="M-10 5.5 L0 10.5 L10 5.5"/></g>
  <text x="90" y="216" class="ti">SquashFS</text>
  <text x="90" y="238" class="ca">podpisany · &lt;80 MB</text>

  <rect x="169" y="142" width="132" height="112" rx="10" class="card c-cy"/>
  <circle cx="235" cy="172" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(235 172)" class="ic" stroke="#38BDF8"><rect x="-6" y="-6" width="12" height="12" rx="2"/><path d="M-3 -6 V-10 M3 -6 V-10 M-3 6 V10 M3 6 V10 M-6 -3 H-10 M-6 3 H-10 M6 -3 H10 M6 3 H10"/></g>
  <text x="235" y="216" class="ti">Jądro Linux</text>
  <text x="235" y="238" class="ca">KSPP · bez modułów</text>

  <rect x="314" y="142" width="132" height="112" rx="10" class="card c-cy"/>
  <circle cx="380" cy="172" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(380 172)" class="ic" stroke="#38BDF8"><path d="M-9 -7 L-3 0 L-9 7"/><path d="M0 8 H9"/></g>
  <text x="380" y="216" class="ti">machined</text>
  <text x="380" y="238" class="ca">PID 1 · Go</text>

  <rect x="459" y="142" width="132" height="112" rx="10" class="card c-cy"/>
  <circle cx="525" cy="172" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(525 172)" class="ic" stroke="#38BDF8"><circle r="9.5"/><circle r="3"/><path d="M0 -3 V-9.5 M2.6 -1.5 L8.2 -4.7 M2.6 1.5 L8.2 4.7 M0 3 V9.5 M-2.6 1.5 L-8.2 4.7 M-2.6 -1.5 L-8.2 -4.7"/></g>
  <text x="525" y="216" class="ti">Kubernetes</text>
  <text x="525" y="238" class="ca">własne PKI</text>

  <rect x="604" y="142" width="132" height="112" rx="10" class="card c-cy"/>
  <circle cx="670" cy="172" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(670 172)" class="ic" stroke="#38BDF8"><circle cx="0" cy="-7" r="3.2"/><circle cx="-7.5" cy="6" r="3.2"/><circle cx="7.5" cy="6" r="3.2"/><path d="M-1.6 -4.2 L-5.9 3.2 M1.6 -4.2 L5.9 3.2 M-4.3 6 H4.3"/></g>
  <text x="670" y="216" class="ti">Klaster</text>
  <text x="670" y="238" class="ca">HA · bez SPOF</text>

  <!-- zasady -->
  <rect x="24" y="350" width="132" height="112" rx="10" class="card c-vi"/>
  <circle cx="90" cy="380" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(90 380)" class="ic" stroke="#A78BFA"><path d="M-5 -7 L-11 0 L-5 7 M5 -7 L11 0 L5 7 M2 -9 L-2 9"/></g>
  <text x="90" y="424" class="ti">Od zera</text>
  <text x="90" y="446" class="ca">bez systemd i GNU</text>

  <rect x="169" y="358" width="132" height="104" rx="10" class="card c-vi"/>
  <circle cx="235" cy="386" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(235 386)" class="ic" stroke="#A78BFA"><rect x="-7.5" y="-2" width="15" height="11" rx="2"/><path d="M-4.5 -2 V-5.5 A4.5 4.5 0 0 1 4.5 -5.5 V-2"/></g>
  <text x="235" y="426" class="ti">Niezmienny</text>
  <text x="235" y="446" class="ca">tylko do odczytu</text>

  <rect x="314" y="358" width="132" height="104" rx="10" class="card c-vi"/>
  <circle cx="380" cy="386" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(380 386)" class="ic" stroke="#A78BFA"><rect x="-9.5" y="-9.5" width="19" height="19" rx="2" stroke-dasharray="3 3"/><rect x="-3" y="-3" width="6" height="6" rx="1" fill="#A78BFA"/></g>
  <text x="380" y="426" class="ti">Minimalny</text>
  <text x="380" y="446" class="ca">bez shella i SSH</text>

  <rect x="459" y="358" width="132" height="104" rx="10" class="card c-gr"/>
  <circle cx="525" cy="386" r="18" fill="#34D399" fill-opacity=".13"/>
  <g transform="translate(525 386)" class="ic" stroke="#34D399"><path d="M8 -3 A8.5 8.5 0 0 0 -7.5 -4"/><path d="M8.5 -9 V-3 H2.5"/><path d="M-8 3 A8.5 8.5 0 0 0 7.5 4"/><path d="M-8.5 9 V3 H-2.5"/></g>
  <text x="525" y="426" class="ti">Efemeryczny</text>
  <text x="525" y="446" class="ca">dane odtwarzalne</text>

  <rect x="604" y="350" width="132" height="112" rx="10" class="card c-vi"/>
  <circle cx="670" cy="380" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(670 380)" class="ic" stroke="#A78BFA"><path d="M0 -10 L8.5 -6.5 V0 C8.5 5.5 4.5 8.8 0 10.5 C-4.5 8.8 -8.5 5.5 -8.5 0 V-6.5 Z"/><path d="M-3.5 0 L-1 2.5 L4 -2.5"/></g>
  <text x="670" y="424" class="ti">Bezpieczny</text>
  <text x="670" y="446" class="ca">bez haseł · mTLS</text>
</svg>
