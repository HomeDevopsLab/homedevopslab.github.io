<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Talos Linux – stos systemu i zasady projektowe</title>
  <desc id="d">Jedna deklaratywna konfiguracja YAML opisuje stos Talosa: obraz SquashFS, jądro Linux, machined, Kubernetes i klaster HA. Poniżej zasady: napisany od zera, niezmienny, minimalny, efemeryczny i bezpieczny.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2E2A6B" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0A0F1F" stop-opacity="0"/>
    </radialGradient>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38BDF8"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34D399"/>
    </marker>
  </defs>
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap');
    .ti { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #E2E8F0; text-anchor: middle; }
    .ca { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace; font-size: 11.5px; fill: #8B9BB4; text-anchor: middle; }
    .gl { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 500; letter-spacing: 2.4px; }
    .pill { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; text-anchor: middle; }
    .card { fill: #111A2E; stroke-width: 1.4; }
    .c-cy { stroke: #2B6F99; } .c-vi { stroke: #6D5BB5; } .c-pk { stroke: #9D3F72; } .c-gr { stroke: #1F8A66; }
    .ic { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 5 5; animation: dash 1.1s linear infinite; }
    .dots { fill: none; stroke-width: 1.6; stroke-dasharray: 2 5; animation: dots 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -10; } }
    @keyframes dots { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .flow, .dots { animation: none; } }
  ]]></style>

  <rect width="1280" height="450" rx="18" fill="#0A0F1F"/>
  <rect width="1280" height="450" rx="18" fill="url(#glow)"/>

  <!-- ===== Grupy ===== -->
  <rect x="266" y="30" width="986" height="164" rx="12" fill="#0E1A33" fill-opacity=".7" stroke="#1C3556"/>
  <text x="284" y="52" class="gl" fill="#38BDF8">STOS SYSTEMU</text>

  <rect x="266" y="234" width="986" height="164" rx="12" fill="#14143A" fill-opacity=".6" stroke="#2E2A5E"/>
  <text x="284" y="256" class="gl" fill="#A78BFA">ZASADY PROJEKTOWE</text>
  <rect x="468" y="266" width="560" height="124" rx="12" fill="none" stroke="#4B4290" stroke-dasharray="4 4"/>

  <!-- ===== Połączenia ===== -->
  <path d="M208 212 H236 V126 H278" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M208 242 H236 V330 H278" class="flow" stroke="#A78BFA" marker-end="url(#av)"/>

  <path d="M440 126 H470" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M632 126 H662" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M824 126 H854" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>
  <path d="M1016 126 H1046" class="flow" stroke="#38BDF8" marker-end="url(#ac)"/>

  <path d="M440 330 H462" class="flow" stroke="#A78BFA" marker-end="url(#av)"/>

  <path d="M936 272 V190" class="dots" stroke="#34D399" marker-end="url(#ag)"/>
  <path d="M1206 126 H1264 V418 H126 V292" class="dots" stroke="#A78BFA" marker-end="url(#av)"/>

  <!-- pigułki -->
  <rect x="604" y="257" width="288" height="19" rx="9.5" fill="#0F1230" stroke="#4B4290"/>
  <text x="748" y="270.5" class="pill" fill="#C4B5FD">jeden obraz, nigdy nie modyfikowany</text>

  <rect x="944" y="216" width="146" height="21" rx="10.5" fill="#0B1F1C" stroke="#1F8A66"/>
  <text x="1017" y="230.5" class="pill" fill="#6EE7B7">dane replikowane</text>

  <rect x="456" y="408" width="368" height="21" rx="10.5" fill="#0F1230" stroke="#4B4290"/>
  <text x="640" y="422.5" class="pill" fill="#C4B5FD">awaria węzła → nowy z tej samej konfiguracji</text>

  <!-- ===== Konfiguracja ===== -->
  <rect x="46" y="172" width="160" height="112" rx="10" class="card c-pk"/>
  <circle cx="126" cy="204" r="18" fill="#F472B6" fill-opacity=".14"/>
  <g transform="translate(126 204)" class="ic" stroke="#F472B6">
    <path d="M-7 -10 H3 L8 -5 V10 H-7 Z"/><path d="M3 -10 V-5 H8"/><path d="M-3 0 H4 M-3 5 H2"/>
  </g>
  <text x="126" y="248" class="ti">Konfiguracja</text>
  <text x="126" y="270" class="ca">jeden plik YAML</text>

  <!-- ===== Stos systemu ===== -->
  <!-- SquashFS -->
  <rect x="284" y="70" width="152" height="112" rx="10" class="card c-cy"/>
  <circle cx="360" cy="102" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(360 102)" class="ic" stroke="#38BDF8">
    <path d="M0 -9 L10 -4 L0 1 L-10 -4 Z"/><path d="M-10 1 L0 6 L10 1"/><path d="M-10 5.5 L0 10.5 L10 5.5"/>
  </g>
  <text x="360" y="146" class="ti">SquashFS</text>
  <text x="360" y="168" class="ca">podpisany · &lt;80 MB</text>

  <!-- Jądro -->
  <rect x="476" y="70" width="152" height="112" rx="10" class="card c-cy"/>
  <circle cx="552" cy="102" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(552 102)" class="ic" stroke="#38BDF8">
    <rect x="-6" y="-6" width="12" height="12" rx="2"/>
    <path d="M-3 -6 V-10 M3 -6 V-10 M-3 6 V10 M3 6 V10 M-6 -3 H-10 M-6 3 H-10 M6 -3 H10 M6 3 H10"/>
  </g>
  <text x="552" y="146" class="ti">Jądro Linux</text>
  <text x="552" y="168" class="ca">KSPP · bez modułów</text>

  <!-- machined -->
  <rect x="668" y="70" width="152" height="112" rx="10" class="card c-cy"/>
  <circle cx="744" cy="102" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(744 102)" class="ic" stroke="#38BDF8">
    <path d="M-9 -7 L-3 0 L-9 7"/><path d="M0 8 H9"/>
  </g>
  <text x="744" y="146" class="ti">machined</text>
  <text x="744" y="168" class="ca">PID 1 · Go</text>

  <!-- Kubernetes -->
  <rect x="860" y="70" width="152" height="112" rx="10" class="card c-cy"/>
  <circle cx="936" cy="102" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(936 102)" class="ic" stroke="#38BDF8">
    <circle r="9.5"/><circle r="3"/>
    <path d="M0 -3 V-9.5 M2.6 -1.5 L8.2 -4.7 M2.6 1.5 L8.2 4.7 M0 3 V9.5 M-2.6 1.5 L-8.2 4.7 M-2.6 -1.5 L-8.2 -4.7"/>
  </g>
  <text x="936" y="146" class="ti">Kubernetes</text>
  <text x="936" y="168" class="ca">własne PKI</text>

  <!-- Klaster -->
  <rect x="1052" y="70" width="152" height="112" rx="10" class="card c-cy"/>
  <circle cx="1128" cy="102" r="18" fill="#38BDF8" fill-opacity=".12"/>
  <g transform="translate(1128 102)" class="ic" stroke="#38BDF8">
    <circle cx="0" cy="-7" r="3.2"/><circle cx="-7.5" cy="6" r="3.2"/><circle cx="7.5" cy="6" r="3.2"/>
    <path d="M-1.6 -4.2 L-5.9 3.2 M1.6 -4.2 L5.9 3.2 M-4.3 6 H4.3"/>
  </g>
  <text x="1128" y="146" class="ti">Klaster</text>
  <text x="1128" y="168" class="ca">HA · bez SPOF</text>

  <!-- ===== Zasady ===== -->
  <!-- Od zera -->
  <rect x="284" y="274" width="152" height="112" rx="10" class="card c-vi"/>
  <circle cx="360" cy="306" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(360 306)" class="ic" stroke="#A78BFA">
    <path d="M-5 -7 L-11 0 L-5 7 M5 -7 L11 0 L5 7 M2 -9 L-2 9"/>
  </g>
  <text x="360" y="350" class="ti">Od zera</text>
  <text x="360" y="372" class="ca">bez systemd i GNU</text>

  <!-- Niezmienny -->
  <rect x="476" y="282" width="152" height="104" rx="10" class="card c-vi"/>
  <circle cx="552" cy="312" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(552 312)" class="ic" stroke="#A78BFA">
    <rect x="-7.5" y="-2" width="15" height="11" rx="2"/><path d="M-4.5 -2 V-5.5 A4.5 4.5 0 0 1 4.5 -5.5 V-2"/>
  </g>
  <text x="552" y="352" class="ti">Niezmienny</text>
  <text x="552" y="372" class="ca">tylko do odczytu</text>

  <!-- Minimalny -->
  <rect x="668" y="282" width="152" height="104" rx="10" class="card c-vi"/>
  <circle cx="744" cy="312" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(744 312)" class="ic" stroke="#A78BFA">
    <rect x="-9.5" y="-9.5" width="19" height="19" rx="2" stroke-dasharray="3 3"/>
    <rect x="-3" y="-3" width="6" height="6" rx="1" fill="#A78BFA"/>
  </g>
  <text x="744" y="352" class="ti">Minimalny</text>
  <text x="744" y="372" class="ca">bez shella i SSH</text>

  <!-- Efemeryczny -->
  <rect x="860" y="282" width="152" height="104" rx="10" class="card c-gr"/>
  <circle cx="936" cy="312" r="18" fill="#34D399" fill-opacity=".13"/>
  <g transform="translate(936 312)" class="ic" stroke="#34D399">
    <path d="M8 -3 A8.5 8.5 0 0 0 -7.5 -4"/><path d="M8.5 -9 V-3 H2.5"/>
    <path d="M-8 3 A8.5 8.5 0 0 0 7.5 4"/><path d="M-8.5 9 V3 H-2.5"/>
  </g>
  <text x="936" y="352" class="ti">Efemeryczny</text>
  <text x="936" y="372" class="ca">wszystko odtwarzalne</text>

  <!-- Bezpieczny -->
  <rect x="1052" y="274" width="152" height="112" rx="10" class="card c-vi"/>
  <circle cx="1128" cy="306" r="18" fill="#A78BFA" fill-opacity=".14"/>
  <g transform="translate(1128 306)" class="ic" stroke="#A78BFA">
    <path d="M0 -10 L8.5 -6.5 V0 C8.5 5.5 4.5 8.8 0 10.5 C-4.5 8.8 -8.5 5.5 -8.5 0 V-6.5 Z"/>
    <path d="M-3.5 0 L-1 2.5 L4 -2.5"/>
  </g>
  <text x="1128" y="350" class="ti">Bezpieczny</text>
  <text x="1128" y="372" class="ca">bez haseł · mTLS</text>
</svg>
